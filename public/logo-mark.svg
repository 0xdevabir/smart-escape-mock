<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="TrustLens">
  <defs>
    <linearGradient id="tl-ring" x1="12" y1="10" x2="52" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c4d6bd"/>
      <stop offset="55%" stop-color="#a8bca1"/>
      <stop offset="100%" stop-color="#6f8a68"/>
    </linearGradient>
    <linearGradient id="tl-core" x1="24" y1="22" x2="40" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#96eefb"/>
      <stop offset="100%" stop-color="#a8bca1"/>
    </linearGradient>
    <radialGradient id="tl-glow" cx="32" cy="30" r="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a8bca1" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#a8bca1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Tile -->
  <rect width="64" height="64" rx="18" fill="#1b1b1b"/>
  <circle cx="32" cy="30" r="18" fill="url(#tl-glow)"/>

  <!-- Outer lens -->
  <circle cx="32" cy="30" r="16.5" fill="none" stroke="url(#tl-ring)" stroke-width="2.4"/>

  <!-- Inner aperture ring -->
  <circle cx="32" cy="30" r="10.2" fill="none" stroke="#a8bca1" stroke-width="1.6" opacity="0.85"/>

  <!-- Scan arc (trust sweep) -->
  <path d="M18.8 33.5a13.8 13.8 0 0 1 22.4-10.2" fill="none" stroke="#96eefb" stroke-width="2" stroke-linecap="round" opacity="0.9"/>

  <!-- Focus core -->
  <circle cx="32" cy="30" r="4.2" fill="url(#tl-core)"/>
  <circle cx="32" cy="30" r="1.7" fill="#1b1b1b"/>

  <!-- Secure base mark (subtle shield tip / trust anchor) -->
  <path d="M26.5 46.5h11" stroke="#a8bca1" stroke-width="2.2" stroke-linecap="round" opacity="0.55"/>
  <path d="M32 42.2v5.8" stroke="#a8bca1" stroke-width="2.2" stroke-linecap="round" opacity="0.7"/>
</svg>
